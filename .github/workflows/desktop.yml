name: Desktop (legacy Tauri, manual)

# The Tauri desktop app is frozen reference code: it is not built on push or on tags.
# Run this workflow by hand from the Actions tab when you deliberately want to verify it.

on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quick-build:
    name: Legacy build check (Linux)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.x

    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

    - name: Install frontend dependencies
      run: bun install --frozen-lockfile

    - name: Build frontend
      run: bun run build

    # Skip SQLx prepare for CI builds - use offline mode disabled instead

    - name: Build Rust backend (check compilation)
      working-directory: ./src-tauri
      env:
        SQLX_OFFLINE: true
      run: cargo build --release

  test:
    name: Legacy checks and tests
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.x

    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

    - name: Install frontend dependencies
      run: bun install --frozen-lockfile

    - name: Run frontend checks
      run: bun run check

    - name: Run Rust tests
      working-directory: ./src-tauri
      env:
        SQLX_OFFLINE: true
      run: cargo test --all-targets --all-features

    - name: Run Rust clippy
      working-directory: ./src-tauri
      env:
        SQLX_OFFLINE: true
      run: cargo clippy -- -D warnings

    - name: Check Rust formatting
      working-directory: ./src-tauri
      run: cargo fmt --all -- --check
